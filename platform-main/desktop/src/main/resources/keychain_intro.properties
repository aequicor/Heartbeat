title=Before you start
heading=macOS will ask to use your Keychain
body=Heartbeat keeps your API keys and sign-ins in the macOS Keychain, so they are encrypted and never stored in plain files. The first time they are needed, macOS shows a notice that Heartbeat "wants to use confidential information" and asks for your login password.
advice=This is expected. Enter your password and choose "Always Allow": macOS asks again only after Heartbeat is updated.
continue=Continue
