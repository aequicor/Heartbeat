title=Перед началом работы
heading=macOS попросит доступ к связке ключей
body=Heartbeat хранит ваши API-ключи и входы в связке ключей macOS: они зашифрованы и не лежат в обычных файлах. Когда ключи понадобятся впервые, macOS покажет уведомление, что Heartbeat «хочет использовать конфиденциальную информацию», и попросит пароль от вашей учётной записи.
advice=Так и должно быть. Введите пароль и выберите «Всегда разрешать»: macOS спросит снова только после обновления Heartbeat.
continue=Продолжить
