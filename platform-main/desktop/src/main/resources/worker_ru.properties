title=Фоновые процессы
description=Хранилище Heartbeat уже занято. Это окно только наблюдает за его владельцем; закрытие окна не останавливает его.
unavailable=Исполнитель недоступен или данные открыты в другом окне студии. Это окно не открывает его хранилища. Если идёт остановка, дождитесь завершения.
handover=Для возврата в студию остановите исполнитель, дождитесь его выхода, закройте это окно и запустите Heartbeat снова. Существующие решения сохраняют исходные проверки.
stop=Остановить исполнитель
workflows=Работающие workflow
decisions=Ожидающие решения процессов
phase.Starting=Запуск исполнителя
phase.Recovering=Восстановление журналов и расписания
phase.Running=Исполнитель работает
phase.Waiting=Ожидание действия пользователя
phase.Stopping=Остановка сессий и ресурсов
phase.Failed=Освобождение ресурсов не подтверждено
problem.FeatureDisabled=Перед запуском включите harness.background_worker в панели флагов.
problem.StorageUnavailable=Профиль или защищённое хранилище недоступны. Остановите исполнитель и проверьте профиль и авторизацию в студии.
problem.RecoveryFailed=Восстановление журналов завершилось ошибкой или истёк срок ожидания. Исполнение приостановлено; откройте студию для проверки.
problem.InteractionRequired=Требуется ваше решение. Остановите исполнитель и откройте студию. Исполнитель не выдаёт разрешений.
problem.CleanupFailed=Завершение работы ресурсов не подтверждено. Проверьте логи перед запуском другого хоста.
