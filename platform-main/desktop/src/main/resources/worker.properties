title=Background processes
description=Heartbeat storage is already in use. This window only monitors its owner; closing it leaves that owner running.
unavailable=The execution owner is unavailable or is the desktop UI. This window does not open its stores. If it is shutting down, wait for completion.
handover=To return to the studio, stop the worker, wait for it to exit, close this window and open Heartbeat again. Existing approvals remain subject to their original checks.
stop=Stop worker
workflows=Running workflows
decisions=Pending process decisions
phase.Starting=Starting worker
phase.Recovering=Restoring journals and scheduling
phase.Running=Worker is running
phase.Waiting=Waiting for user action
phase.Stopping=Stopping sessions and resources
phase.Failed=Cleanup could not be confirmed
problem.FeatureDisabled=Enable harness.background_worker in the toggle panel before starting the worker.
problem.StorageUnavailable=Profile or protected storage is unavailable. Stop the worker and open the studio to check the profile and authorization.
problem.RecoveryFailed=Journal recovery failed or timed out. Execution is paused; open the studio to investigate.
problem.InteractionRequired=An action needs your input. Stop the worker and open the studio. The worker cannot grant approvals.
problem.CleanupFailed=Resource shutdown was not confirmed. Check the logs before starting another host.
