name: Bundle train
description: >-
  Assemble the desktop bundles and write train-manifest.json with only the jars that changed since the previous
  train; every bundle carries the absolute url of the release that holds its jar.
inputs:
  train:
    description: >-
      Train id (the tag is train-<id>): t<sha12> for a train without ProGuard (shrink off, published after every merge),
      o<sha12> for a processed one (nightly and releases). Each family is diffed against its own previous train: a
      processed jar never equals an unprocessed one, so a diff across families would republish every bundle.
    required: true
  out:
    description: Directory for train-manifest.json and the changed jars.
    default: train-out
  base-url:
    description: >-
      Download URL of the release that publishes this train, ending with '/'
      (https://github.com/<repo>/releases/download/<tag>/): the url of every jar the train carries itself.
    required: true
  github-token:
    description: Token that reads the previous train release.
    required: true
  shrink:
    description: >-
      How the jars are processed by ProGuard (-Pheartbeat.trainShrink): off, shrink or obfuscate. A processed train is
      started headless by verifyShrunkTrain before it is written; an obfuscated one carries the mapping of every jar it publishes.
    default: obfuscate
  launcher-signing-key:
    description: >-
      PKCS#8 Ed25519 private key (Base64) that signs the launcher entry of the train
      (HEARTBEAT_LAUNCHER_SIGNING_KEY). Empty: the entry is written unsigned and installed apps do not take that
      launcher. A secret of the environment launcher-signing, which only master can use.
    required: false
    default: ''
  launcher-signing-required:
    description: >-
      'true': the build fails when no signing key is given (publishing on master): a missing secret must stop the
      publication, not publish a launcher that no installed app takes. 'false' (a dry run): the launcher stays unsigned.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Find the previous train
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        TRAIN: ${{ inputs.train }}
        SHRINK: ${{ inputs.shrink }}
      # No previous train is the only reason to go on without one: a failing gh call or a published train
      # without its manifest stops the build instead of silently republishing every jar.
      run: |
        case "$SHRINK:$TRAIN" in
          off:t*) family=t ;;
          shrink:o* | obfuscate:o*) family=o ;;
          *)
            echo "Train $TRAIN does not match shrink=$SHRINK: t<sha12> is built with off, o<sha12> with shrink or obfuscate" >&2
            exit 1
            ;;
        esac
        rm -rf train-previous
        mkdir -p train-previous
        # The same tag filter as prerelease.yml: only train-<family><sha12> pre-releases are trains of this family.
        is_train="test(\"^train-${family}[0-9a-f]{12}\$\")"
        tag=$(gh release list --limit 100 --json tagName,isDraft \
          --jq "[.[] | select(.isDraft | not) | select(.tagName | $is_train) | select(.tagName != \"train-$TRAIN\")][0].tagName // \"\"")
        if [ -n "$tag" ]; then
          gh release download "$tag" --pattern train-manifest.json --dir train-previous
          echo "Previous train: $tag"
        else
          echo "No previous train: every jar is published"
        fi
        ls train-previous
    - name: Level of the launcher
      shell: bash
      # The level orders the signed launchers of the train: a slot with a lower one is refused. It is the number of
      # commits of the first-parent history (master) that changed the launcher: it grows along master and stays while
      # the launcher is untouched. An unchanged launcher is then published once: train_manifest.py reuses its entry
      # together with the signature made for it (the signature covers the train id, so it is not re-signed per train).
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
          echo "The launcher level counts commits: check out with fetch-depth: 0" >&2
          exit 1
        fi
        level=$(git rev-list --count --first-parent HEAD -- platform-main/launcher)
        if [ "$level" -lt 1 ]; then
          echo "No commit changed platform-main/launcher: the launcher level is $level" >&2
          exit 1
        fi
        echo "LAUNCHER_API=$level" >> "$GITHUB_ENV"
        echo "Launcher level: $level" >> "$GITHUB_STEP_SUMMARY"
    - name: Check the signing key
      if: inputs.launcher-signing-required == 'true' && inputs.launcher-signing-key == ''
      shell: bash
      run: |
        echo "The launcher has to be signed here, but no signing key was given: is the secret HEARTBEAT_LAUNCHER_SIGNING_KEY set in the environment launcher-signing?" >&2
        exit 1
    - name: Assemble the bundles
      shell: bash
      env:
        HEARTBEAT_LAUNCHER_SIGNING_KEY: ${{ inputs.launcher-signing-key }}
        TRAIN: ${{ inputs.train }}
        SHRINK: ${{ inputs.shrink }}
      # The jar name carries the train id; the build cache makes unchanged bundles cache hits, and
      # train_manifest.py maps their identical jars back to the version of the train that first published them.
      # With shrink != off assembleBundle runs ProGuard (foundation first), on the JBR 21 of the desktop runtime.
      run: |
        ./gradlew -Pheartbeat.bundleVersion="$TRAIN" -Pheartbeat.trainShrink="$SHRINK" \
          -Pheartbeat.launcherApi="$LAUNCHER_API" \
          -Porg.gradle.java.installations.auto-detect=false \
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_17_AARCH64 \
          assembleBundle bundleManifest --no-daemon --stacktrace --profile
    - name: Start the processed train
      if: inputs.shrink != 'off'
      shell: bash
      env:
        HEARTBEAT_LAUNCHER_SIGNING_KEY: ${{ inputs.launcher-signing-key }}
        TRAIN: ${{ inputs.train }}
        SHRINK: ${{ inputs.shrink }}
      # Nothing is written before every bundle of the processed train is healthy in a headless run. The run depends on
      # bundleManifest again: without the key and the level it would write the manifest unsigned over the signed one.
      run: |
        env -u LD_LIBRARY_PATH xvfb-run --auto-servernum ./gradlew -Pheartbeat.bundleVersion="$TRAIN" \
          -Pheartbeat.trainShrink="$SHRINK" -Pheartbeat.launcherApi="$LAUNCHER_API" \
          -Porg.gradle.java.installations.auto-detect=false \
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_17_AARCH64 \
          :platform-main:desktop:verifyShrunkTrain --no-daemon --stacktrace --profile
    - name: Write the train
      shell: bash
      env:
        TRAIN: ${{ inputs.train }}
        OUT: ${{ inputs.out }}
        BASE_URL: ${{ inputs.base-url }}
        SHRINK: ${{ inputs.shrink }}
        SIGNED: ${{ inputs.launcher-signing-key != '' }}
      run: |
        # With a key the launcher entry has to be signed: a manifest rewritten without it would publish a launcher
        # that no installed app takes, and nobody would notice before the first update.
        if [ "$SIGNED" = true ] && ! python3 -c "
        import json, sys
        entries = [b for b in json.load(open('build/bundles/manifest.json'))['bundles'] if b.get('kind') == 'launcher']
        sys.exit(0 if len(entries) == 1 and entries[0].get('signature') else 1)"; then
          echo "The launcher entry of the manifest is not signed although a signing key was given" >&2
          exit 1
        fi
        rm -rf train-jars train-mappings "$OUT"
        mkdir train-jars
        cp bundles/*/build/bundle/*.jar platform-main/desktop/build/bundle/*.jar train-jars/
        previous=()
        if [ -f train-previous/train-manifest.json ]; then
          previous=(--previous train-previous/train-manifest.json)
        fi
        mappings=()
        if [ "$SHRINK" = obfuscate ]; then
          # The mapping of a jar is published by the train that first carries the jar: retrace.py reads it there.
          mkdir train-mappings
          cp bundles/*/build/train/mapping-*.txt platform-main/desktop/build/train/mapping-*.txt train-mappings/
          mappings=(--mappings train-mappings)
        fi
        python3 scripts/train_manifest.py --built build/bundles/manifest.json --jars train-jars \
          "${previous[@]}" "${mappings[@]}" --train "$TRAIN" --base-url "$BASE_URL" --out "$OUT"
        cat "$OUT/train-manifest.json"
