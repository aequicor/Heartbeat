name: Repository scripts

# Unit tests of the Python tools in scripts/ and of what they exercise: the issue-closing workflow snippet and the
# bundled Pi extensions. Runs only when one of them changes.
on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/close-fixed-issues.yml'
      - '.github/workflows/scripts.yml'
      - 'features/ai-engine/pi/impl/src/jvmMain/resources/pi/**'

permissions:
  contents: read

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-commit-policy.txt
      - name: Install tokenizer
        run: python -m pip install -r scripts/requirements-commit-policy.txt
      - name: Test repository scripts
        run: python -m unittest discover -s scripts/tests -v
