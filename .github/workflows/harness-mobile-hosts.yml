name: Harness mobile hosts

# A single-module build: the harness implementation compiled for its unsupported Android and iOS hosts, which agents
# on Windows cannot compile locally. Runs for ready PRs that change the sources of those targets, dependency versions
# or build logic; drafts skip it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'features/harness/api/build.gradle.kts'
      - 'features/harness/api/src/commonMain/**'
      - 'features/harness/impl/build.gradle.kts'
      - 'features/harness/impl/src/commonMain/**'
      - 'features/harness/impl/src/androidMain/**'
      - 'features/harness/impl/src/iosMain/**'
      - 'gradle/**'
      - 'build-logic/**'
      - '.github/workflows/harness-mobile-hosts.yml'

permissions:
  contents: read

concurrency:
  group: harness-mobile-hosts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile mobile hosts
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Compile the unsupported mobile hosts
        run: ./gradlew :features:harness:impl:compileAndroidMain :features:harness:impl:compileKotlinIosSimulatorArm64 --stacktrace
