name: Module build

# Builds only the modules a change touches, on the OS chosen for the run; nothing builds automatically on PRs.
# An agent starts it when it needs an OS it lacks locally (iOS targets from Windows, a feature's behavior on Windows
# or macOS), the user at will. Only module tasks `:<module>:<task>` are accepted, never whole-project ones, run tasks
# (an app would hang until the timeout) or iOS tasks off macOS (they would pass without compiling for Apple):
#   gh workflow run module-build.yml --ref <branch> -f os=macos-15 -f tasks=':features:<name>:impl:compileKotlinIosSimulatorArm64'
# A new run on the same branch and OS cancels the previous one.
run-name: 'Module build on ${{ inputs.os }}: ${{ inputs.tasks }}'
on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner OS
        type: choice
        options: [ubuntu-latest, macos-15, windows-2025]
        default: ubuntu-latest
      tasks:
        description: 'Module tasks separated by spaces, e.g. :features:harness:impl:compileKotlinIosSimulatorArm64'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: module-build-${{ github.ref }}-${{ inputs.os }}
  cancel-in-progress: true

jobs:
  build:
    name: Module build (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Build the module tasks
        shell: bash
        env:
          TASKS: ${{ inputs.tasks }}
        run: |
          if [[ $TASKS == *[$'\n\r']* ]]; then
            echo "::error::Module tasks must be on one line, separated by spaces"
            exit 1
          fi
          read -ra tasks <<< "$TASKS"
          if [ "${#tasks[@]}" -eq 0 ]; then
            echo "::error::No module tasks given"
            exit 1
          fi
          for task in "${tasks[@]}"; do
            # A project path and a task name: root tasks such as :build or allTests are refused.
            if [[ ! $task =~ ^(:[A-Za-z0-9_.-]+)+:[A-Za-z][A-Za-z0-9]*$ ]]; then
              printf '::error::Not a module task: %s\n' "$task"
              exit 1
            fi
            name=${task##*:}
            if [[ $name == run* ]]; then
              printf '::error::Run tasks never finish on a runner: %s\n' "$task"
              exit 1
            fi
            if [[ $RUNNER_OS != macOS && $name =~ ^ios|Ios|Apple|Xcode ]]; then
              printf '::error::iOS tasks compile only on macos-15: %s\n' "$task"
              exit 1
            fi
          done
          native_browser=false
          for task in "${tasks[@]}"; do
            case "$task" in
              :features:browser:impl:browserNativeTest|:features:browser:impl:browserDocumentNativeTest)
                native_browser=true ;;
            esac
          done
          if [[ $RUNNER_OS == Linux && $native_browser == true ]]; then
            sudo apt-get update
            sudo apt-get install -y libatomic1 xvfb xauth \
              libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
              libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
              libasound2t64 libgtk-3-0t64 libx11-6 libxcb1 libxext6 libxrender1 libxtst6
            # --info includes the test's timeout stack and last native stage in the job log.
            xvfb-run --auto-servernum ./gradlew "${tasks[@]}" --continue --stacktrace --info
          else
            ./gradlew "${tasks[@]}" --continue --stacktrace
          fi
