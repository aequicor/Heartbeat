name: Release

# Run workflow on master with patch, minor or major to publish the next Heartbeat release.
# Publishing needs every job to pass: all tests, the Android and iOS builds, and the five desktop
# installers, each checked by running its packaged app (verifyReleaseHarnessCompiler).
# JVM tests seed portable task outputs; Linux builds the shared Wasm panel once.
# Remaining desktop/mobile builds and platform tests fan out from Linux. Host toolchains stay
# OS/architecture-specific. Linux ships a DEB for Ubuntu 24.04 x64 with Secret Service and X11/XWayland.
# Installed release builds update themselves from the latest release (features/app-update): the release is
# created as a draft, gets every installer and SHA256SUMS, and only then becomes public and latest. The asset
# names are what the app looks for (ReleasePlatform in features/app-update/impl): keep them in sync.
# dry_run builds and checks everything without creating a tag or publishing:
#   gh workflow run release.yml --ref <branch> -f release_level=patch -F dry_run=true
run-name: "Release ${{ inputs.release_level }}${{ inputs.dry_run && ' (dry run)' || '' }}"
on:
  workflow_dispatch:
    inputs:
      release_level:
        description: 'Release level / Уровень релиза'
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
      dry_run:
        description: 'Only build and check, without publishing / Пробный прогон'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize version selection and publication, including runs from different branches.
  group: heartbeat-release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Choose the next version
        id: version
        shell: bash
        env:
          LEVEL: ${{ inputs.release_level }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 scripts/release_version.py --level="$LEVEL" --ref="$REF" --dry-run="$DRY_RUN" > version.txt
          cat version.txt >> "$GITHUB_OUTPUT"
          cat version.txt >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: JVM tests
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: ./.github/actions/gradle-cache
        with:
          stage: checks
          save-portable: 'true'
          upstream: desktop-linux
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test repository scripts
        run: |
          python -m pip install -r scripts/requirements-commit-policy.txt
          python -m unittest discover -s scripts/tests -v
          python -m unittest discover -s native/jcef -p "test_*.py" -v
      - name: Test all JVM modules
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >-
          xvfb-run --auto-servernum ./gradlew -Pheartbeat.version="$VERSION"
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_17_AARCH64
          jvmTest :platform-main:desktop:test :lint:detekt-rules:test
          --no-daemon --continue --stacktrace --profile

      - name: Upload Gradle timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports-jvm
          path: |
            build/reports/profile/
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  desktop-linux:
    name: Desktop Linux x64
    needs: [version, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: ./.github/actions/gradle-cache
        with:
          stage: desktop-linux
          save-portable: 'true'
          upstream: checks
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libatomic1 fakeroot dpkg-dev libsecret-1-0 gnome-keyring dbus-x11 xvfb xauth \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 libgtk-3-0t64 libx11-6 libxcb1 libxext6 libxrender1 libxtst6
      - name: Verify Linux runtimes and package the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # One Gradle invocation shares configuration and compilation across the native checks and packaging.
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/heartbeat-test-keyring-data"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/heartbeat-test-keyring-runtime"
          mkdir -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -euo pipefail <<'TEST'
          printf '%s\n' 'heartbeat-ci-synthetic-keyring' | gnome-keyring-daemon --unlock --components=secrets
          xvfb-run --auto-servernum ./gradlew -Pheartbeat.version="$VERSION" \
            -Porg.gradle.java.installations.auto-detect=false \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_17_AARCH64 \
            :core:secrets:impl:nativeSecretsTest \
            :features:browser:impl:browserNativeTest :features:browser:impl:browserDocumentNativeTest \
            :platform-main:desktop:verifyReleaseHarnessCompiler :platform-main:desktop:packageReleaseDeb \
            :chromium-plugin:panel:prepareChromiumPanelArtifact \
            --no-daemon --stacktrace --profile
          TEST
      - uses: actions/upload-artifact@v7
        with:
          name: chromium-panel
          path: chromium-plugin/panel/build/release-panel/
          if-no-files-found: error
          retention-days: 7
      - name: Name the Linux installer
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          packages=(platform-main/desktop/build/compose/binaries/main-release/deb/*.deb)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one Debian package"
            exit 1
          fi
          mkdir release
          cp "${packages[0]}" "release/Heartbeat-$VERSION-linux-x64.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-x64
          path: release/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Gradle timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports-linux
          path: |
            build/reports/profile/
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  platform-tests:
    name: All platform tests
    needs: [version, desktop-linux]
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: ./.github/actions/gradle-cache
        with:
          stage: platform-tests
          native-outputs: 'true'
          upstream: desktop-linux
      - name: Test all platform targets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # Re-run JVM tests on macOS as well: host-specific Test inputs prevent Linux result reuse.
        run: >-
          ./gradlew -Pheartbeat.version="$VERSION"
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_17_AARCH64
          allTests :platform-main:desktop:test :lint:detekt-rules:test
          --no-daemon --continue --stacktrace --profile

      - name: Upload Gradle timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports-platform-tests
          path: |
            build/reports/profile/
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android release
    needs: [version, desktop-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: ./.github/actions/gradle-cache
        with:
          stage: android
          upstream: desktop-linux
      - name: Build the Android app
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >-
          ./gradlew -Pheartbeat.version="$VERSION"
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_17_AARCH64
          :platform-main:android:assembleRelease
          --no-daemon --stacktrace --profile
      - name: Upload Gradle timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports-android
          path: |
            build/reports/profile/
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS framework
    needs: [version, desktop-linux]
    # The Intel runner has 14 GiB RAM; the 7 GiB arm64 runner cannot fit the release linker heap.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: ./.github/actions/gradle-cache
        id: gradle-cache
        with:
          stage: ios
          native-outputs: 'true'
          upstream: desktop-linux
      - name: Identify the exact iOS framework build
        id: ios-framework-key
        env:
          VERSION: ${{ needs.version.outputs.version }}
          APPLE_FINGERPRINT: ${{ steps.gradle-cache.outputs.apple-toolchain-fingerprint }}
        run: |
          FRAMEWORK_KEY=$(python3 scripts/ios_framework_cache.py key \
            --version "$VERSION" --apple-fingerprint "$APPLE_FINGERPRINT" \
            --java-home "$JAVA_HOME" --java-home "$JAVA_HOME_17_X64" \
            --identity "$RUNNER_TEMP/ios-framework-identity.json")
          echo "key=$FRAMEWORK_KEY" >> "$GITHUB_OUTPUT"

      # No restore prefix: changed inputs must run the optimized release linker.
      - name: Restore the exact iOS framework archive
        id: ios-framework-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ios-framework-cache
          key: release-ios-framework-v1-${{ steps.ios-framework-key.outputs.key }}

      - name: Validate and unpack the cached iOS framework
        if: steps.ios-framework-cache.outputs.cache-hit == 'true'
        run: >-
          python3 scripts/ios_framework_cache.py restore
          --identity "$RUNNER_TEMP/ios-framework-identity.json"
          --cache-directory "$RUNNER_TEMP/ios-framework-cache"
          --directory platform-main/shared/build/bin/iosArm64/releaseFramework
      - name: Build the iOS framework
        if: steps.ios-framework-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # Kotlin/Native links in the Gradle JVM. The release optimizer exceeds the default 4 GiB heap.
        run: >-
          ./gradlew -Pheartbeat.version="$VERSION"
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_17_AARCH64
          -Dorg.gradle.jvmargs="-Xmx8g -Dfile.encoding=UTF-8"
          :platform-main:shared:linkReleaseFrameworkIosArm64
          --no-daemon --stacktrace --profile
      - name: Archive the successfully linked iOS framework
        if: steps.ios-framework-cache.outputs.cache-hit != 'true'
        run: >-
          python3 scripts/ios_framework_cache.py pack
          --identity "$RUNNER_TEMP/ios-framework-identity.json"
          --cache-directory "$RUNNER_TEMP/ios-framework-cache"
          --directory platform-main/shared/build/bin/iosArm64/releaseFramework

      - name: Save the exact iOS framework archive
        if: steps.ios-framework-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ios-framework-cache
          key: release-ios-framework-v1-${{ steps.ios-framework-key.outputs.key }}

      - name: Upload Gradle timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports-ios
          path: |
            build/reports/profile/
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: [version, desktop-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            task: packageReleaseDmg
          - platform: macos-x64
            runner: macos-15-intel
            task: packageReleaseDmg
          - platform: windows-x64
            runner: windows-2025
            task: packageReleaseInnoSetup
          - platform: windows-arm64
            runner: windows-11-arm
            task: packageReleaseInnoSetup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: ./.github/actions/gradle-cache
        with:
          stage: desktop
          upstream: desktop-linux
      - uses: actions/download-artifact@v8
        with:
          name: chromium-panel
          path: .release-panel
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        # packaging/windows/heartbeat.iss needs Inno Setup 6.6 or newer; the newest installed major is used.
        run: choco install innosetup --no-progress -y
      - name: Package and check the release app
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TASK: ${{ matrix.task }}
        run: >-
          ./gradlew -Pheartbeat.version="$VERSION"
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_17_AARCH64
          -Pheartbeat.chromiumPanelDir=.release-panel
          :platform-main:desktop:verifyReleaseHarnessCompiler ":platform-main:desktop:$TASK"
          --no-daemon --stacktrace --profile
      - name: Name the installer
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          binaries=platform-main/desktop/build/compose/binaries/main-release
          mkdir release
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$binaries/exe/Heartbeat-$VERSION-setup.exe" "release/Heartbeat-$VERSION-$PLATFORM-setup.exe"
          else
            images=("$binaries"/dmg/*.dmg)
            if [ "${#images[@]}" -ne 1 ]; then
              echo "::error::Expected one disk image"
              exit 1
            fi
            cp "${images[0]}" "release/Heartbeat-$VERSION-$PLATFORM.dmg"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: release/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Gradle timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports-${{ matrix.platform }}
          path: |
            build/reports/profile/
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish
    needs: [version, checks, desktop-linux, desktop, platform-tests, android, ios]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # A retry may find its own tag, but must never publish assets for another commit.
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::Release tag already points to another commit"
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Write checksums
        working-directory: release
        run: |
          sha256sum Heartbeat-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          Установленный Heartbeat находит этот релиз при запуске. На macOS и Windows кнопка «Обновить» в шапке
          сайдбара студии устанавливает обновление; на Linux она открывает страницу загрузки DEB для пакетного менеджера.

          Первая установка:
          - macOS: `macos-arm64` — Apple Silicon, `macos-x64` — Intel. Откройте DMG и перетащите приложение в
            «Программы». Сборка не подписана: при первом запуске откройте его из контекстного меню «Открыть» или
            разрешите в «Системные настройки → Конфиденциальность и безопасность».
          - Windows: `windows-x64` или `windows-arm64`, запустите `…-setup.exe`. SmartScreen может предупредить о
            неизвестном издателе: «Подробнее → Выполнить в любом случае».

          - Linux: Ubuntu 24.04 x64, графическая сессия X11 или XWayland, разблокированное хранилище Secret Service
            (например GNOME Keyring). Скачайте `linux-x64.deb` и установите `sudo apt install ./Heartbeat-*-linux-x64.deb`.
            Обновления устанавливаются той же командой. Ключи хранятся в системном keyring; plaintext fallback отсутствует.

          `SHA256SUMS` — контрольные суммы всех файлов релиза.
          NOTES
          # A re-run continues a draft left by a failed run; a published release is never replaced.
          if gh release view "$TAG" --json isDraft --jq .isDraft > draft 2>/dev/null; then
            if [ "$(cat draft)" != true ]; then
              echo "::error::Release $TAG is already published"
              exit 1
            fi
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --draft --verify-tag --title "Heartbeat $VERSION" \
              --notes-file notes.md --generate-notes
          fi
          # Public only with every asset: installed apps take the latest release as soon as it appears.
          gh release edit "$TAG" --draft=false --latest
