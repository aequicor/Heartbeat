name: Release

# Run workflow on master with patch, minor or major to publish the next Heartbeat release.
# Publishing needs every job to pass: all tests, the Android and iOS builds, and the five desktop
# installers, each checked by running its packaged app (verifyReleaseHarnessCompiler). The release carries every
# platform: the desktop installers, the Android APK signed with the key of the environment android-signing and an
# unsigned iOS IPA for sideloading.
# JVM tests seed portable task outputs; Linux builds the shared Wasm panel once.
# Remaining desktop/mobile builds and platform tests fan out from Linux. Host toolchains stay
# OS/architecture-specific. Linux ships a DEB for Ubuntu 24.04 x64 with Secret Service and X11/XWayland.
# Installed release builds update themselves from the latest release (features/app-update): the release is
# created as a draft, gets every installer and SHA256SUMS, and only then becomes public and latest. The asset
# names are what the app looks for (ReleasePlatform in features/app-update/impl): keep them in sync.
# The release is also a channel of bundles: it carries the train of its commit (train-manifest.json and the jars
# that changed), promoted from the pre-release that prerelease.yml tested, or built here when there is none. Every
# installer is the platform plus the whole train as its seed (scripts/train_seed.py) and must fit the size budget
# (scripts/check_installer_size.py) before anything is published.
# dry_run builds and checks everything without creating a tag or publishing:
#   gh workflow run release.yml --ref <branch> -f release_level=patch -F dry_run=true
run-name: "Release ${{ inputs.release_level }}${{ inputs.dry_run && ' (dry run)' || '' }}"
on:
  workflow_dispatch:
    inputs:
      release_level:
        description: 'Release level / Уровень релиза'
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
      dry_run:
        description: 'Only build and check, without publishing / Пробный прогон'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize version selection and publication, including runs from different branches.
  group: heartbeat-release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Choose the next version
        id: version
        shell: bash
        env:
          LEVEL: ${{ inputs.release_level }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 scripts/release_version.py --level="$LEVEL" --ref="$REF" --dry-run="$DRY_RUN" > version.txt
          cat version.txt >> "$GITHUB_OUTPUT"
          cat version.txt >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: JVM tests
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: ./.github/actions/gradle-cache
        with:
          stage: checks
          save-portable: 'true'
          upstream: desktop-linux
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test repository scripts
        run: |
          python -m pip install -r scripts/requirements-commit-policy.txt
          python -m unittest discover -s scripts/tests -v
          python -m unittest discover -s native/jcef -p "test_*.py" -v
      - name: Test all JVM modules
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # setup-python adds a loader path for Python; it is not part of the JVM/Git execution environment.
        # Keep the evidence and actual shell environment identical without this unrelated loader override.
        run: >-
          env -u LD_LIBRARY_PATH xvfb-run --auto-servernum ./gradlew -Pheartbeat.version="$VERSION"
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_17_AARCH64
          jvmTest :platform-main:desktop:test :lint:detekt-rules:test
          --no-daemon --continue --stacktrace --profile

      - name: Upload Gradle timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports-jvm
          path: |
            build/reports/profile/
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  train:
    name: Bundle train
    needs: [version, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The launcher of a train built here is signed with HEARTBEAT_LAUNCHER_SIGNING_KEY of the environment launcher-signing,
    # which only master can use. A dry run (it may come from a working branch) takes the environment without secrets:
    # its launcher is unsigned, and no installed app takes it.
    environment: ${{ inputs.dry_run && 'launcher-dry-run' || 'launcher-signing' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the level of the launcher counts the commits that changed it
          fetch-depth: 0
          persist-credentials: false
      - name: Promote the tested train of this commit
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # prerelease.yml tested and published the train of every master commit that changed a bundle.
          train="t${GITHUB_SHA:0:12}"
          echo "train=$train" >> "$GITHUB_OUTPUT"
          # Only "no such release" or a draft left by a failed run means there is nothing to promote; any other
          # gh failure stops the job instead of rebuilding a train that differs from the tested one.
          if draft=$(gh release view "train-$train" --json isDraft --jq .isDraft 2>view.err) && [ "$draft" = false ]; then
            gh release download "train-$train" --dir train-out --pattern '*'
            echo "promoted=true" >> "$GITHUB_OUTPUT"
            echo "Promoting train $train" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$draft" = true ] || grep -qi 'release not found' view.err; then
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            echo "No published pre-release train for this commit: building it" >> "$GITHUB_STEP_SUMMARY"
          else
            cat view.err >&2
            exit 1
          fi
      - uses: actions/setup-java@v6
        if: steps.promote.outputs.promoted != 'true'
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-java@v6
        if: steps.promote.outputs.promoted != 'true'
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: ./.github/actions/gradle-cache
        if: steps.promote.outputs.promoted != 'true'
        with:
          stage: train
          upstream: checks
      - uses: ./.github/actions/bundle-train
        if: steps.promote.outputs.promoted != 'true'
        with:
          train: ${{ steps.promote.outputs.train }}
          base-url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/
          github-token: ${{ github.token }}
          launcher-signing-key: ${{ secrets.HEARTBEAT_LAUNCHER_SIGNING_KEY }}
          launcher-signing-required: ${{ !inputs.dry_run }}
      - name: Check the train manifest
        run: test -s train-out/train-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: train
          path: train-out/
          if-no-files-found: error
          retention-days: 7
      # The installers start offline: their seed is the whole train, with the jars of earlier trains downloaded by
      # the url of the manifest and every jar checked against its SHA-256.
      - name: Assemble the seed of the installers
        run: python3 scripts/train_seed.py --train-dir train-out --out train-seed
      - uses: actions/upload-artifact@v7
        with:
          name: train-seed
          path: train-seed/
          if-no-files-found: error
          retention-days: 7

  desktop-linux:
    name: Desktop Linux x64
    needs: [version, checks, train]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: ./.github/actions/gradle-cache
        with:
          stage: desktop-linux
          save-portable: 'true'
          upstream: checks
      - uses: actions/download-artifact@v8
        with:
          name: train-seed
          path: .release-seed
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libatomic1 fakeroot dpkg-dev libsecret-1-0 gnome-keyring dbus-x11 xvfb xauth \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 libgtk-3-0t64 libx11-6 libxcb1 libxext6 libxrender1 libxtst6
      - name: Verify Linux runtimes and package the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # One Gradle invocation shares configuration and compilation across the native checks and packaging.
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/heartbeat-test-keyring-data"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/heartbeat-test-keyring-runtime"
          mkdir -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -euo pipefail <<'TEST'
          printf '%s\n' 'heartbeat-ci-synthetic-keyring' | gnome-keyring-daemon --unlock --components=secrets
          xvfb-run --auto-servernum ./gradlew -Pheartbeat.version="$VERSION" \
            -Porg.gradle.java.installations.auto-detect=false \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_17_AARCH64 \
            :core:secrets:impl:nativeSecretsTest \
            :features:browser:impl:browserNativeTest :features:browser:impl:browserDocumentNativeTest \
            :platform-main:desktop:verifyReleaseHarnessCompiler :platform-main:desktop:packageReleaseDeb \
            :chromium-plugin:panel:prepareChromiumPanelArtifact \
            -Pheartbeat.seedDir=.release-seed \
            --no-daemon --stacktrace --profile
          TEST
      - uses: actions/upload-artifact@v7
        with:
          name: chromium-panel
          path: chromium-plugin/panel/build/release-panel/
          if-no-files-found: error
          retention-days: 7
      - name: Name the Linux installer
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          packages=(platform-main/desktop/build/compose/binaries/main-release/deb/*.deb)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one Debian package"
            exit 1
          fi
          mkdir release
          cp "${packages[0]}" "release/Heartbeat-$VERSION-linux-x64.deb"
          # The installers pin this portable first-use component; publish it in the same release and checksum set.
          cp "platform-main/desktop/build/release-components/Heartbeat-$VERSION-chromium-extension.zip" release/
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-x64
          path: release/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Gradle timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports-linux
          path: |
            build/reports/profile/
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  platform-tests:
    name: All platform tests
    needs: [version, desktop-linux]
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: ./.github/actions/gradle-cache
        with:
          stage: platform-tests
          native-outputs: 'true'
          upstream: desktop-linux
      - name: Test all platform targets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # Re-run JVM tests on macOS as well: host-specific Test inputs prevent Linux result reuse.
        run: >-
          ./gradlew -Pheartbeat.version="$VERSION"
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_17_AARCH64
          allTests :platform-main:desktop:test :lint:detekt-rules:test
          --no-daemon --continue --stacktrace --profile

      - name: Upload Gradle timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports-platform-tests
          path: |
            build/reports/profile/
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android release
    needs: [version, desktop-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The APK is signed with the release key of the environment android-signing, which only master can use. A dry run
    # (it may come from a working branch) takes the environment without secrets and builds an unsigned APK.
    environment: ${{ inputs.dry_run && 'android-dry-run' || 'android-signing' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: ./.github/actions/gradle-cache
        with:
          stage: android
          upstream: desktop-linux
      - name: Restore the release signing key
        if: ${{ !inputs.dry_run }}
        env:
          KEYSTORE_BASE64: ${{ secrets.HEARTBEAT_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::HEARTBEAT_ANDROID_KEYSTORE_BASE64 of the environment android-signing is not set"
            exit 1
          fi
          printf %s "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          echo "HEARTBEAT_ANDROID_KEYSTORE=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_ENV"
      - name: Build the Android app
        env:
          VERSION: ${{ needs.version.outputs.version }}
          HEARTBEAT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HEARTBEAT_ANDROID_KEYSTORE_PASSWORD }}
          HEARTBEAT_ANDROID_KEY_ALIAS: ${{ secrets.HEARTBEAT_ANDROID_KEY_ALIAS }}
          HEARTBEAT_ANDROID_KEY_PASSWORD: ${{ secrets.HEARTBEAT_ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew -Pheartbeat.version="$VERSION"
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_17_AARCH64
          :platform-main:android:assembleRelease
          --no-daemon --stacktrace --profile
      - name: Collect the APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGNED: ${{ !inputs.dry_run }}
        run: |
          shopt -s nullglob
          apks=(platform-main/android/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected one release APK, found ${#apks[@]}"
            exit 1
          fi
          if [ "$SIGNED" = true ]; then
            build_tools=("$ANDROID_HOME"/build-tools/*)
            "${build_tools[-1]}/apksigner" verify --print-certs "${apks[0]}"
          fi
          mkdir -p release
          cp "${apks[0]}" "release/Heartbeat-$VERSION-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-android
          path: release/
          if-no-files-found: error
          retention-days: 7
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks"
      - name: Upload Gradle timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports-android
          path: |
            build/reports/profile/
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS release
    needs: [version, desktop-linux]
    # The Intel runner has 14 GiB RAM; the 7 GiB arm64 runner cannot fit the release linker heap.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: ./.github/actions/gradle-cache
        with:
          stage: ios
          native-outputs: 'true'
          upstream: desktop-linux
      # The Xcode build phase runs Gradle itself (embedAndSignAppleFrameworkForXcode links the framework and copies
      # the Compose resources into the app), so the settings of the other jobs' command lines go to the user
      # gradle.properties. Kotlin/Native links in the Gradle JVM: the release optimizer exceeds the default 4 GiB heap.
      - name: Configure Gradle for the Xcode build phase
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          cat >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties" <<PROPS
          heartbeat.version=$VERSION
          org.gradle.java.installations.auto-detect=false
          org.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_17_AARCH64
          org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8
          PROPS
      # No Apple account in CI: the archive is unsigned and the IPA is installed by sideloading, which re-signs it.
      - name: Build the iOS app
        env:
          VERSION: ${{ needs.version.outputs.version }}
        working-directory: platform-main/ios
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          build_number=$((major * 1000000 + minor * 1000 + patch))
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/heartbeat.xcarchive" archive \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$build_number" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package the IPA
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          app="$RUNNER_TEMP/heartbeat.xcarchive/Products/Applications/heartbeat.app"
          if [ ! -x "$app/heartbeat" ] || [ ! -d "$app/compose-resources" ]; then
            echo "::error::The archive has no complete heartbeat.app"
            exit 1
          fi
          payload="$RUNNER_TEMP/ipa"
          mkdir -p "$payload/Payload" release
          cp -R "$app" "$payload/Payload/"
          (cd "$payload" && zip -qr -y "$GITHUB_WORKSPACE/release/Heartbeat-$VERSION-ios.ipa" Payload)
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-ios
          path: release/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Gradle timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports-ios
          path: |
            build/reports/profile/
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: [version, desktop-linux, train]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            task: packageReleaseDmg
          - platform: macos-x64
            runner: macos-15-intel
            task: packageReleaseDmg
          - platform: windows-x64
            runner: windows-2025
            task: packageReleaseInnoSetup
          - platform: windows-arm64
            runner: windows-11-arm
            task: packageReleaseInnoSetup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: ./.github/actions/gradle-cache
        with:
          stage: desktop
          upstream: desktop-linux
      - uses: actions/download-artifact@v8
        with:
          name: chromium-panel
          path: .release-panel
      - uses: actions/download-artifact@v8
        with:
          name: train-seed
          path: .release-seed
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        # packaging/windows/heartbeat.iss needs Inno Setup 6.6 or newer; the newest installed major is used.
        run: choco install innosetup --no-progress -y
      - name: Package and check the release app
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TASK: ${{ matrix.task }}
        run: >-
          ./gradlew -Pheartbeat.version="$VERSION"
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_17_X64,JAVA_HOME_17_AARCH64
          -Pheartbeat.chromiumPanelDir=.release-panel
          -Pheartbeat.seedDir=.release-seed
          :platform-main:desktop:verifyReleaseHarnessCompiler ":platform-main:desktop:$TASK"
          --no-daemon --stacktrace --profile
      - name: Name the installer
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          binaries=platform-main/desktop/build/compose/binaries/main-release
          mkdir release
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$binaries/exe/Heartbeat-$VERSION-setup.exe" "release/Heartbeat-$VERSION-$PLATFORM-setup.exe"
          else
            images=("$binaries"/dmg/*.dmg)
            if [ "${#images[@]}" -ne 1 ]; then
              echo "::error::Expected one disk image"
              exit 1
            fi
            cp "${images[0]}" "release/Heartbeat-$VERSION-$PLATFORM.dmg"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: release/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Gradle timing and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports-${{ matrix.platform }}
          path: |
            build/reports/profile/
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  installer-size:
    name: Installer size
    needs: [desktop-linux, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Check the installers against the size budget
        run: |
          set -o pipefail  # the gate is the script's exit code, not tee's
          shopt -s nullglob
          installers=(release/*.dmg release/*.exe release/*.deb)
          if [ "${#installers[@]}" -ne 5 ]; then
            echo "::error::Expected 5 installers, found ${#installers[@]}"
            exit 1
          fi
          python3 scripts/check_installer_size.py "${installers[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: [version, checks, train, installer-size, desktop-linux, desktop, platform-tests, android, ios]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # A retry may find its own tag, but must never publish assets for another commit.
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::Release tag already points to another commit"
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: mobile-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: train
          path: release
      - name: Write checksums
        working-directory: release
        run: |
          shopt -s nullglob  # a train may carry no jar of its own
          sha256sum Heartbeat-* bundle-*.jar train-manifest.json > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          Установленный Heartbeat находит этот релиз при запуске. На macOS и Windows кнопка «Обновить» в шапке
          сайдбара студии устанавливает обновление; на Linux она открывает страницу загрузки DEB для пакетного менеджера.

          Первая установка:
          - macOS: `macos-arm64` — Apple Silicon, `macos-x64` — Intel. Откройте DMG и перетащите приложение в
            «Программы». Сборка не подписана: при первом запуске откройте его из контекстного меню «Открыть» или
            разрешите в «Системные настройки → Конфиденциальность и безопасность».
          - Windows: `windows-x64` или `windows-arm64`, запустите `…-setup.exe`. SmartScreen может предупредить о
            неизвестном издателе: «Подробнее → Выполнить в любом случае».

          - Linux: Ubuntu 24.04 x64, графическая сессия X11 или XWayland, разблокированное хранилище Secret Service
            (например GNOME Keyring). Скачайте `linux-x64.deb` и установите `sudo apt install ./Heartbeat-*-linux-x64.deb`.
            Обновления устанавливаются той же командой. Ключи хранятся в системном keyring; plaintext fallback отсутствует.
          - Android: скачайте `…-android.apk` и установите, разрешив установку из этого источника. Следующие версии
            ставятся поверх той же подписью.
          - iOS: `…-ios.ipa` не подписан. Установите его через AltStore или Sideloadly, они подпишут приложение вашим
            Apple ID (бесплатная подпись действует 7 дней).

          `SHA256SUMS` — контрольные суммы всех файлов релиза.
          NOTES
          # A re-run continues a draft left by a failed run; a published release is never replaced.
          if gh release view "$TAG" --json isDraft --jq .isDraft > draft 2>/dev/null; then
            if [ "$(cat draft)" != true ]; then
              echo "::error::Release $TAG is already published"
              exit 1
            fi
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --draft --verify-tag --title "Heartbeat $VERSION" \
              --notes-file notes.md --generate-notes
          fi
          # Public only with every asset: installed apps take the latest release as soon as it appears.
          gh release edit "$TAG" --draft=false --latest
