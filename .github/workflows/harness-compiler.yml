name: Packaged harness compiler

# A long build, outside PR verification: the release app image and its harness compiler probe on macOS and Windows,
# tens of runner minutes. Run it by hand, at the user's decision, when a change can affect the packaged compiler:
# harness sources, the APIs on the script classpath (ai-engine facade, scheduler), the desktop app and its build
# classpath, dependency versions, build logic.
#   gh workflow run harness-compiler.yml --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-compiler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-probe:
    name: Release probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Probe the release app image
        shell: bash
        run: ./gradlew :platform-main:desktop:verifyReleaseHarnessCompiler --stacktrace
