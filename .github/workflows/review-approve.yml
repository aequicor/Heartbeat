name: Review approval

# The owner's `/reviewed [sha]` comment on a PR becomes an approval by github-actions[bot],
# which satisfies the required review in the default-branch ruleset without a merge bypass.
# Runs the default-branch version of the script; PR code is never checked out.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: review-approve-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    name: Approve reviewed head
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/reviewed')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/review_approve.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Approve if the owner reviewed the current head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/review_approve.py
