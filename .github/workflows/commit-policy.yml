name: Commit policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  commit-size:
    name: Commit size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-commit-policy.txt
      - name: Install tokenizer
        run: python -m pip install -r scripts/requirements-commit-policy.txt
      - name: Test commit policy checker
        run: python -m unittest discover -s scripts/tests -v
      - name: Check every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_commit_size.py --base "$BASE_SHA" --head "$HEAD_SHA"
