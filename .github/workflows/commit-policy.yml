name: Commit policy

# Mandatory for every PR, drafts included: no path filter and no skip condition, since a skipped job reports success
# over an earlier failure. `edited` reruns it for a changed base branch; `ready_for_review` cannot change the verdict.
# Tests of the checker itself run in scripts.yml, only when the scripts change.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: commit-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-size:
    name: Commit size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-commit-policy.txt
      - name: Install tokenizer
        run: python -m pip install -r scripts/requirements-commit-policy.txt
      - name: Check every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_commit_size.py --base "$BASE_SHA" --head "$HEAD_SHA"
