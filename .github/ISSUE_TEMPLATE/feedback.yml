name: 💡 Пожелание
description: Идея или пожелание по продукту
labels: ["type:feedback", "source:user"]
body:
  - type: textarea
    id: wish
    attributes:
      label: Пожелание
      description: Чего не хватает; начни с новой строки после служебной строки.
      value: "<!-- type:feedback -->"
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Сценарий использования
      description: В какой ситуации это пригодится?
  - type: textarea
    id: why
    attributes:
      label: Почему это важно
