name: 🐞 Дефект
description: Сломано или работает не так, как задумано
labels: ["type:defect", "source:user"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло
      description: Опиши дефект; начни с новой строки после служебной строки.
      value: "<!-- type:defect -->"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидалось
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1.
        2.
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: Версия приложения, ОС, движок/модель — если релевантно.
