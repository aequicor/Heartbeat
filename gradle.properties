#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Heartbeat
# App version of desktop and Android builds: the release workflow passes the computed version with -Pheartbeat.version.
heartbeat.version=1.0.0
# GitHub repository (owner/name) whose releases installed desktop release builds update from.
heartbeat.updateRepository=aequicor/Heartbeat
