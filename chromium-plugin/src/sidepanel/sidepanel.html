<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heartbeat</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="bar">
    <button id="back" class="icon" type="button" hidden></button>
    <h1 id="title">Heartbeat</h1>
    <button id="new-chat" class="icon" type="button"></button>
  </header>
  <div id="notice" class="banner" hidden></div>
  <div id="error" class="banner problem" hidden>
    <span id="error-text"></span>
    <button id="error-dismiss" class="link" type="button"></button>
  </div>
  <section id="agent" class="agent" hidden>
    <label class="consent"><input id="consent" type="checkbox"> <span id="consent-label"></span></label>
    <p id="consent-hint" class="meta"></p>
    <div id="agent-tabs" class="agent-tabs" hidden>
      <span id="agent-count"></span>
      <button id="revoke" class="secondary" type="button"></button>
    </div>
  </section>
  <div id="search" class="search">
    <button id="search-row" class="nav-row" type="button"></button>
    <div id="search-box" class="search-box" hidden>
      <input id="search-field" type="search">
      <button id="search-clear" class="icon" type="button"></button>
    </div>
  </div>
  <main id="content"></main>
  <nav id="rail" class="rail">
    <button id="rail-sessions" class="rail-item" type="button"></button>
    <button id="rail-archive" class="rail-item" type="button"></button>
  </nav>
  <div id="permissions"></div>
  <footer id="composer" class="composer">
    <div id="composer-context" class="composer-context"></div>
    <div id="attachments" class="chips"></div>
    <div class="composer-box">
      <textarea id="prompt" rows="1"></textarea>
      <div class="composer-toolbar">
        <div id="composer-lead" class="toolbar-group lead"></div>
        <div class="toolbar-group trail">
          <span id="composer-trail" class="toolbar-group"></span>
          <button id="stop" class="send" type="button" hidden></button>
          <button id="send" class="send" type="button"></button>
        </div>
      </div>
    </div>
    <p id="composer-hint" class="meta"></p>
  </footer>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
