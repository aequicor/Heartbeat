<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heartbeat</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="bar">
    <button id="back" class="icon" type="button" hidden>←</button>
    <h1 id="title">Heartbeat</h1>
    <button id="new-chat" class="secondary" type="button"></button>
  </header>
  <div id="notice" class="banner" hidden></div>
  <div id="error" class="banner problem" hidden>
    <span id="error-text"></span>
    <button id="error-dismiss" class="link" type="button"></button>
  </div>
  <input id="filter" class="filter" type="search">
  <main id="content"></main>
  <div id="permissions"></div>
  <footer id="composer" class="composer">
    <select id="project"></select>
    <div id="attachments" class="chips"></div>
    <textarea id="prompt" rows="3"></textarea>
    <div class="composer-actions">
      <span id="composer-hint" class="meta"></span>
      <button id="stop" class="secondary" type="button" hidden></button>
      <button id="send" class="primary" type="button"></button>
    </div>
  </footer>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
